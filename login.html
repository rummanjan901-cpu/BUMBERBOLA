<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudyAI — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
  <style>
    /* ── Login-specific overrides ── */
    body { background: var(--bg-grad); min-height: 100vh; display: flex; align-items: center; justify-content: center; }

    .auth-wrap {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; width: 100%; padding: 1.5rem;
    }

    .auth-card {
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(1.6);
      -webkit-backdrop-filter: blur(22px) saturate(1.6);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 3rem 2.8rem;
      width: 100%; max-width: 440px;
      box-shadow: 0 24px 64px rgba(37,99,235,.18), 0 2px 8px rgba(0,0,0,.06);
      animation: slideUp .55s cubic-bezier(.22,1,.36,1) both;
    }

    .auth-logo {
      display: flex; align-items: center; gap: .6rem; margin-bottom: 2rem;
      justify-content: center;
    }
    .auth-logo .icon { width: 40px; height: 40px; background: var(--accent-grad); border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
    .auth-logo span { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.5rem; color: var(--text-primary); }
    .auth-logo .ai-badge { font-size: .7rem; color: var(--blue); font-weight: 600; background: rgba(37,99,235,.1); border-radius: 6px; padding: 2px 7px; }

    .auth-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.7rem; color: var(--text-primary); text-align: center; margin-bottom: .35rem; }
    .auth-sub { text-align: center; color: var(--text-muted); font-size: .9rem; margin-bottom: 2rem; }

    .tab-row { display: flex; background: rgba(37,99,235,.07); border-radius: 14px; padding: 4px; margin-bottom: 1.8rem; }
    .tab-btn { flex: 1; border: none; background: none; font-family: 'DM Sans', sans-serif; font-size: .9rem;
      font-weight: 500; color: var(--text-muted); padding: .6rem 1rem; border-radius: 11px; cursor: pointer;
      transition: all .25s; }
    .tab-btn.active { background: #fff; color: var(--blue); box-shadow: 0 2px 10px rgba(37,99,235,.15); }

    .auth-form { display: none; flex-direction: column; gap: 1rem; }
    .auth-form.active { display: flex; }

    .field-label { font-size: .8rem; font-weight: 500; color: var(--text-muted); margin-bottom: .3rem; letter-spacing: .03em; text-transform: uppercase; }
    .field-wrap { position: relative; }
    .field-wrap .field-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 1rem; pointer-events: none; }
    .auth-input {
      width: 100%; padding: .82rem 1rem .82rem 2.75rem;
      border: 1.5px solid rgba(37,99,235,.18);
      border-radius: 13px; font-family: 'DM Sans', sans-serif; font-size: .95rem;
      background: rgba(255,255,255,.75); color: var(--text-primary);
      outline: none; transition: border .2s, box-shadow .2s; box-sizing: border-box;
    }
    .auth-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }

    .auth-btn {
      width: 100%; padding: .88rem; border: none; border-radius: 13px;
      background: var(--accent-grad); color: #fff; font-family: 'Syne', sans-serif;
      font-weight: 700; font-size: 1rem; cursor: pointer; letter-spacing: .02em;
      box-shadow: 0 4px 18px rgba(37,99,235,.35); transition: transform .18s, box-shadow .18s;
      margin-top: .3rem;
    }
    .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(37,99,235,.45); }
    .auth-btn:active { transform: translateY(0); }

    .auth-error { background: rgba(239,68,68,.08); color: #dc2626; border: 1px solid rgba(239,68,68,.2);
      border-radius: 10px; padding: .65rem 1rem; font-size: .85rem; text-align: center; display: none; }
    .auth-error.show { display: block; }

    .auth-divider { text-align: center; color: var(--text-muted); font-size: .8rem; margin: .5rem 0; }

    /* background orbs */
    .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .35; pointer-events: none; z-index: -1; }
    .orb-1 { width: 420px; height: 420px; background: radial-gradient(circle, #3b82f6, #6366f1); top: -120px; right: -100px; }
    .orb-2 { width: 340px; height: 340px; background: radial-gradient(circle, #0ea5e9, #06b6d4); bottom: -80px; left: -100px; }

    @keyframes slideUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="icon">🧠</div>
        <span>StudyAI</span>
        <span class="ai-badge">AI</span>
      </div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-sub">Your AI-powered study companion</p>

      <div class="tab-row">
        <button class="tab-btn active" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <form class="auth-form active" id="login-form" onsubmit="handleLogin(event)">
        <div>
          <div class="field-label">Email</div>
          <div class="field-wrap">
            <span class="field-icon">✉️</span>
            <input class="auth-input" id="login-email" type="email" placeholder="you@example.com" required />
          </div>
        </div>
        <div>
          <div class="field-label">Password</div>
          <div class="field-wrap">
            <span class="field-icon">🔑</span>
            <input class="auth-input" id="login-pass" type="password" placeholder="••••••••" required />
          </div>
        </div>
        <div class="auth-error" id="login-err"></div>
        <button class="auth-btn" type="submit">Sign In →</button>
      </form>

      <!-- SIGNUP FORM -->
      <form class="auth-form" id="signup-form" onsubmit="handleSignup(event)">
        <div>
          <div class="field-label">Email</div>
          <div class="field-wrap">
            <span class="field-icon">✉️</span>
            <input class="auth-input" id="signup-email" type="email" placeholder="you@example.com" required />
          </div>
        </div>
        <div>
          <div class="field-label">Password</div>
          <div class="field-wrap">
            <span class="field-icon">🔑</span>
            <input class="auth-input" id="signup-pass" type="password" placeholder="Min. 6 characters" required />
          </div>
        </div>
        <div>
          <div class="field-label">Confirm Password</div>
          <div class="field-wrap">
            <span class="field-icon">🔒</span>
            <input class="auth-input" id="signup-pass2" type="password" placeholder="Repeat password" required />
          </div>
        </div>
        <div class="auth-error" id="signup-err"></div>
        <button class="auth-btn" type="submit">Create Account →</button>
      </form>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_DOMAIN",
      projectId: "YOUR_PROJECT_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // redirect if already logged in
    onAuthStateChanged(auth, user => { if (user) window.location.href = 'index.html'; });

    window.handleLogin = async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass  = document.getElementById('login-pass').value;
      const errEl = document.getElementById('login-err');
      errEl.classList.remove('show');
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        window.location.href = 'index.html';
      } catch (err) {
        errEl.textContent = friendlyError(err.code);
        errEl.classList.add('show');
      }
    };

    window.handleSignup = async (e) => {
      e.preventDefault();
      const email = document.getElementById('signup-email').value;
      const pass  = document.getElementById('signup-pass').value;
      const pass2 = document.getElementById('signup-pass2').value;
      const errEl = document.getElementById('signup-err');
      errEl.classList.remove('show');
      if (pass !== pass2) { errEl.textContent = 'Passwords do not match.'; errEl.classList.add('show'); return; }
      try {
        await createUserWithEmailAndPassword(auth, email, pass);
        window.location.href = 'index.html';
      } catch (err) {
        errEl.textContent = friendlyError(err.code);
        errEl.classList.add('show');
      }
    };

    function friendlyError(code) {
      const map = {
        'auth/user-not-found': 'No account found with that email.',
        'auth/wrong-password': 'Incorrect password.',
        'auth/email-already-in-use': 'That email is already registered.',
        'auth/weak-password': 'Password must be at least 6 characters.',
        'auth/invalid-email': 'Please enter a valid email.',
        'auth/invalid-credential': 'Invalid email or password.',
      };
      return map[code] || 'Something went wrong. Try again.';
    }
  </script>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (tab==='login'?i===0:i===1)));
      document.getElementById('login-form').classList.toggle('active', tab==='login');
      document.getElementById('signup-form').classList.toggle('active', tab==='signup');
    }
  </script>
</body>
</html>
